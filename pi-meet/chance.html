<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Πάντα υπάρχει μια πιθανότητα</title>
<meta name="description" content="Το π δεν κλείνει ποτέ τον κύκλο του — αλλά κάθε προσπάθεια περνά πιο κοντά. Και ένα «ναι» το κάνει 3,14.">
<meta name="theme-color" content="#07040f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07040f; --violet:#8f72ff; --lavender:#c9bcff; --gold:#f3cf7a;
    --text:#efeaff; --muted:#a197cc; --glass:rgba(255,255,255,.06); --line:rgba(201,188,255,.2);
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
  body{font-family:var(--serif);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:lining-nums}
  [hidden]{display:none!important}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

  header{position:relative;z-index:3;text-align:center;padding:max(20px,env(safe-area-inset-top)) 16px 0;min-height:84px}
  #forline{font-style:italic;color:var(--muted);font-size:clamp(16px,3.4vw,21px);min-height:1.2em;letter-spacing:.02em}
  #forline b{color:var(--gold);font-weight:500}
  h1{margin:2px 0 0;font-weight:500;font-style:italic;line-height:1.1;font-size:clamp(30px,6.6vw,54px);
    text-shadow:0 0 26px rgba(143,114,255,.4)}
  h1 .gold{color:var(--gold);font-weight:700;font-style:normal;text-shadow:0 0 22px rgba(243,207,122,.55)}
  #statline{font-family:var(--sans);font-size:12.5px;color:var(--muted);letter-spacing:.03em;margin-top:4px;min-height:1.3em;opacity:.85}

  #stage{position:relative;flex:1;min-height:0;z-index:1}
  #stage>canvas{position:absolute;inset:0;width:100%;height:100%}
  #bloom{filter:blur(5px);opacity:.55;mix-blend-mode:screen;transition:opacity 1.2s}
  #trail{mix-blend-mode:screen;transition:opacity .6s ease}
  #arms{mix-blend-mode:screen}
  .fading #trail,.fading #bloom{opacity:0}
  .closed #bloom{opacity:1}

  #lensWrap{position:absolute;top:6px;right:10px;width:var(--ls,180px);height:var(--ls,180px);z-index:4;
    opacity:0;transform:scale(.6);transform-origin:100% 0;transition:opacity .6s ease,transform .7s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
  #lensWrap.on{opacity:1;transform:none}
  #lens{width:100%;height:100%;border-radius:50%;display:block;
    box-shadow:0 0 0 1px rgba(243,207,122,.55),0 0 0 6px rgba(20,12,40,.75),0 0 0 7px rgba(201,188,255,.25),0 10px 40px rgba(0,0,0,.6),0 0 40px rgba(143,114,255,.35)}
  #lensInfo{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:12px;white-space:nowrap;
    font-family:var(--sans);font-size:11.5px;letter-spacing:.04em;color:var(--lavender);text-align:center;line-height:1.5;
    text-shadow:0 1px 6px #000}
  #lensInfo b{color:var(--gold);font-weight:600}

  #story{position:relative;z-index:3;text-align:center;padding:4px 18px 4px;min-height:104px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-style:italic;color:var(--text);font-size:clamp(18px,3.6vw,23px);line-height:1.32}
  #story b{color:var(--gold);font-weight:500}
  #story small{display:block;margin-top:4px;font-family:var(--sans);font-style:normal;font-size:12.5px;color:var(--muted);letter-spacing:.03em}
  .cap{max-width:640px;animation:rise 1.3s ease both}
  .big{display:block;font-size:clamp(32px,7vw,52px);color:var(--gold);font-weight:500;text-shadow:0 0 26px rgba(243,207,122,.5)}
  @keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

  #probe{width:min(560px,100%);font-family:var(--sans);font-style:normal;font-size:14px;color:var(--muted);animation:rise 1.2s ease both}
  #probe .q{font-family:var(--serif);font-style:italic;font-size:clamp(19px,3.8vw,23px);color:var(--text);margin-bottom:6px}
  #probe .row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
  #probe input{flex:1;min-width:150px;max-width:300px;accent-color:var(--gold)}
  #probe output{color:var(--gold);font-weight:600;min-width:92px;text-align:left}
  #probeAns{margin-top:6px;color:var(--lavender)}
  #probeAns b{color:var(--gold);font-weight:700}

  .btn{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--text);cursor:pointer;
    height:40px;padding:0 18px;border-radius:999px;font:600 14px var(--sans);letter-spacing:.02em;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,transform .15s}
  .btn:hover{background:rgba(255,255,255,.11)}
  .btn:active{transform:scale(.97)}
  .btn.gold{background:linear-gradient(180deg,#f7dc96,#e8b95a);color:#2a1a05;border-color:transparent;box-shadow:0 0 24px rgba(243,207,122,.45)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
  .btn.sm{height:34px;padding:0 14px;font-size:13px}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lavender);outline-offset:2px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}

  footer{position:relative;z-index:3;display:flex;gap:8px;justify-content:center;align-items:center;
    padding:4px 16px max(12px,env(safe-area-inset-bottom))}
  .icon{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--text);cursor:pointer;
    height:34px;min-width:34px;padding:0 12px;border-radius:999px;font:600 12.5px var(--sans);letter-spacing:.04em}

  .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;overflow:auto}
  #intro{background:radial-gradient(ellipse at center,rgba(20,10,45,.55),rgba(5,3,12,.92));cursor:pointer;text-align:center;transition:opacity 1s}
  #intro.gone{opacity:0;pointer-events:none}
  #intro .for{font-style:italic;color:var(--muted);font-size:22px}
  #intro .name{font-size:clamp(44px,11vw,84px);font-style:italic;font-weight:500;color:var(--gold);text-shadow:0 0 34px rgba(243,207,122,.5);line-height:1.05;margin:.1em 0 .25em}
  #intro .tap{font-family:var(--sans);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--lavender);animation:breathe 2.4s ease-in-out infinite}
  #intro .snd{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:10px}
  @keyframes breathe{50%{opacity:.35}}

  .card{width:min(540px,100%);background:rgba(16,10,34,.78);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 60px rgba(143,114,255,.18);
    animation:rise 1s ease both;text-align:center}
  #ask{position:fixed;left:16px;right:16px;margin:0 auto;bottom:max(16px,env(safe-area-inset-bottom));z-index:9;width:auto;max-width:540px}
  .asking footer{visibility:hidden}
  #builder{background:rgba(5,3,12,.55)}
  #ask .from{font-style:italic;color:var(--muted);font-size:19px}
  #ask .question{font-size:clamp(30px,7vw,44px);font-weight:500;font-style:italic;line-height:1.12;margin:.15em 0 .2em;color:#fff;text-shadow:0 0 24px rgba(201,188,255,.4)}
  #ask .tries{font-family:var(--sans);font-size:13px;color:var(--lavender);letter-spacing:.02em}
  #ask .hint{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:10px}

  #builder .card{text-align:left}
  #builder h2{margin:0;font-weight:500;font-style:italic;font-size:clamp(30px,6vw,40px);line-height:1.1}
  #builder h2 span{color:var(--gold)}
  #builder p.lead{margin:.4em 0 1em;color:var(--muted);font-style:italic;font-size:18px;line-height:1.35}
  .field{display:block;margin:10px 0;font-family:var(--sans);font-size:12.5px;color:var(--lavender);letter-spacing:.03em}
  .field input,.field textarea{display:block;width:100%;margin-top:5px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font:500 19px var(--serif);padding:9px 12px;resize:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #linkOut{margin-top:14px;font-family:var(--sans);font-size:12.5px;color:var(--muted)}
  #linkOut code{display:block;word-break:break-all;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;color:var(--lavender);font-size:11.5px;max-height:70px;overflow:auto}
  .privacy{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:12px;opacity:.85}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;background:rgba(30,20,60,.95);border:1px solid var(--line);
    padding:8px 16px;border-radius:999px;font:500 13px var(--sans);opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.on{opacity:1}
  @media (max-width:420px){ .two{grid-template-columns:1fr} #story{min-height:118px} }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header>
  <div id="forline"></div>
  <h1 id="counter"></h1>
  <div id="statline"></div>
</header>

<div id="stage" role="img">
  <canvas id="bloom"></canvas>
  <canvas id="trail"></canvas>
  <canvas id="arms"></canvas>
  <div id="lensWrap" aria-hidden="true"><canvas id="lens"></canvas><div id="lensInfo"></div></div>
</div>

<div id="story" aria-live="polite"></div>

<footer>
  <button class="icon" id="muteBtn" aria-label="sound">♪</button>
  <button class="icon" id="langBtn">EN</button>
  <button class="icon" id="makeBtn"></button>
</footer>

<div id="intro" class="overlay" hidden>
  <div>
    <div class="for" id="introFor"></div>
    <div class="name" id="introName"></div>
    <div class="tap" id="introTap"></div>
    <div class="snd" id="introSnd"></div>
  </div>
</div>

<div id="ask" class="card" hidden>
  <div class="from" id="askFrom"></div>
  <div class="question" id="askQ"></div>
  <div class="tries" id="askTries"></div>
  <div class="btns">
    <button class="btn gold" id="yesBtn"></button>
    <button class="btn" id="noBtn"></button>
  </div>
  <div class="hint" id="askHint"></div>
</div>

<div id="builder" class="overlay" hidden>
  <div class="card">
    <h2 id="bTitle"></h2>
    <p class="lead" id="bLead"></p>
    <div class="two">
      <label class="field"><span id="bToL"></span><input id="bTo" maxlength="40" autocomplete="off"></label>
      <label class="field"><span id="bFromL"></span><input id="bFrom" maxlength="40" autocomplete="off"></label>
    </div>
    <label class="field"><span id="bQL"></span><textarea id="bQ" rows="2" maxlength="140"></textarea></label>
    <label class="field"><span id="bNL"></span><input id="bN" type="number" min="0" max="9999" value="0" inputmode="numeric"></label>
    <div class="btns" style="justify-content:flex-start">
      <button class="btn gold" id="bMake"></button>
      <button class="btn ghost" id="bDemo"></button>
    </div>
    <div id="linkOut" hidden>
      <span id="bReady"></span>
      <code id="bLink"></code>
      <div class="btns" style="justify-content:flex-start;margin-top:4px">
        <button class="btn sm" id="bCopy"></button>
        <button class="btn sm" id="bShare"></button>
        <button class="btn sm" id="bPreview"></button>
      </div>
    </div>
    <div class="privacy" id="bPrivacy"></div>
  </div>
</div>

<div id="toast"></div>

/* ---------------- link data (lives in the #fragment, never sent to a server) ---------------- */
function encode(o) {
  const b = new TextEncoder().encode(JSON.stringify(o));

  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decode(str) {
  try {
    const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));

    return {
      to: String(o.to || '').slice(0, 40), from: String(o.from || '').slice(0, 40),
      q: String(o.q || '').slice(0, 140), n: clamp(parseInt(o.n) || 0, 0, 9999), l: o.l === 'en' ? 'en' : 'el'
    };

}

let data = hashData();

let lang = data ? data.l : (Q.get('lang') === 'en' ? 'en' : (navigator.language || '').startsWith('el') || !navigator.language ? 'el' : 'en');

const num = n => Number(n).toLocaleString(lang === 'el' ? 'el-GR' : 'en-US');
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function sci(x, sig = 2) {
  const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
  const ms = m.toLocaleString(lang === 'el' ? 'el-GR' : 'en-US', { maximumSignificantDigits: sig });
  return `${ms}·10${String(e).split('').map(c => SUP[c]).join('')}`;
}

const fmtZoom = z => '×' + (z < 1e6 ? Math.round(z).toLocaleString(lang === 'el' ? 'el-GR' : 'en-US') : sci(z));

/* ---------------- geometry ----------------
   tip(τ) = e^{iτ} + e^{i(kτ+φ)} (unit arms). The meeting point is 2 (both arms pointing right).
   Offsets from it are written with sin² so that tiny distances keep full precision. */
let K = PI;
function rel(t, phi, k = K) {
  const s1 = Math.sin(t / 2), s2 = Math.sin((k * t + phi) / 2);

}
/* closest the path gets to the golden dot during the turn whose arm-2 phase at the finish line is φ,
   as a fraction of the circle's diameter */
function gapRel(phi, k = K) {
  const f = t => { const [x, y] = rel(t, phi, k); return x * x + y * y; };
  let lo, hi;
  if (Math.abs(phi) < .5) { const c = -phi / (1 + k), w = Math.abs(phi) * .5 + 1e-300; lo = c - w; hi = c + w; }

  let x1 = hi - g * (hi - lo), x2 = lo + g * (hi - lo), f1 = f(x1), f2 = f(x2);
  for (let i = 0; i < 160; i++) {
    if (f1 < f2) { hi = x2; x2 = x1; f2 = f1; x1 = hi - g * (hi - lo); f1 = f(x1); }
    else { lo = x1; x1 = x2; f1 = f2; x2 = lo + g * (hi - lo); f2 = f(x2); }
  }
  return Math.sqrt(Math.min(f1, f2)) / 4;

const RECS = RECORDS.map(([n, d]) => ({ n, d, gap: gapRel(TAU * d, PI) }));

/* ---------------- canvases ---------------- */
const stage = $('#stage');
const bg = $('#bg'), bgx = bg.getContext('2d');

const arms = $('#arms'), ax = arms.getContext('2d');

/* ---------------- simulation state ---------------- */

let lensSt = null;

const cam = { s: 1, x: 0, y: 0 };            // world point shown at the stage centre, and zoom
const toS = (x, y) => [cx + (x - cam.x) * cam.s, cy + (y - cam.y) * cam.s];
const camReset = () => { cam.s = 1; cam.x = cx; cam.y = cy; };

const completed = () => nBase + turns;
function pos(t) {

function styleTrail(alpha = .26) {

function layout() {

  for (const c of [trail, arms]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  bloom.width = Math.max(1, Math.round(W * dpr / 4)); bloom.height = Math.max(1, Math.round(H * dpr / 4));
  cx = W * dpr / 2; cy = H * dpr / 2; R = Math.min(W, H) / 2 * .9 * dpr; a = R / 2;
  const ls = clamp(Math.min(W, H) * .36, 112, 210);

  ldpr = Math.min(window.devicePixelRatio || 1, 2);
  lens.width = lens.height = Math.round(ls * ldpr);

}

function drawBackground() {
  const w = innerWidth, h = innerHeight, d = Math.min(window.devicePixelRatio || 1, 2);
  bg.width = Math.round(w * d); bg.height = Math.round(h * d);
  bgx.setTransform(d, 0, 0, d, 0, 0);
  bgx.fillStyle = '#07040f'; bgx.fillRect(0, 0, w, h);
  const neb = (x, y, r, c) => { const g = bgx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); bgx.fillStyle = g; bgx.fillRect(0, 0, w, h); };

  neb(w * .15, h * .2, Math.max(w, h) * .35, 'rgba(90,40,140,.18)');
  neb(w * .85, h * .85, Math.max(w, h) * .4, 'rgba(40,30,110,.22)');

function strokeRange(t0, t1, step) {

/* ---------------- the lens: zoom into the golden dot ---------------- */
function showLens(n, d, gap) {

  const decades = Math.max(0, Math.log10(S1 / S0));

  lensSt = { n, d, gap, S0, S1, start: now + 450, dur };
  lensWrap.classList.add('on');
  holdUntil = Math.max(holdUntil, now + 450 + dur + 1400);
  lensSt.hideAt = now + 450 + dur + 5200;
  Snd.chime(Math.min(5, Math.round(decades / 4)));
}

  lx.globalCompositeOperation = 'source-over';

}

/* ---------------- arms, glow, golden dot ---------------- */
let flashAt = 0;
function drawArms(now) {

  if (flashAt) {
    const e = (now - flashAt) / 1000;
    for (let k = 0; k < 5; k++) {
      const ph = e - k * .4; if (ph < 0 || ph > 2.6) continue;
      ax.strokeStyle = `rgba(255,220,140,${.8 * (1 - ph / 2.6)})`; ax.lineWidth = 2 * dpr;
      ax.beginPath(); ax.arc(mx, my, (8 + ph * 150) * dpr, 0, TAU); ax.stroke();
    }
    const f = Math.max(0, 1 - e / 2);
    if (f > 0) { g = ax.createRadialGradient(mx, my, 0, mx, my, R * .9);
      g.addColorStop(0, `rgba(255,240,200,${.95 * f})`); g.addColorStop(1, 'rgba(255,220,150,0)');
      ax.fillStyle = g; ax.fillRect(0, 0, arms.width, arms.height); }
  }

  if (recent.length > 1) {
    ax.lineCap = 'round';
    const t0 = recent[0][2], span = Math.max(1e-6, tau - t0);
    let prev = toS(recent[0][0], recent[0][1]);
    for (let i = 1; i < recent.length; i++) {
      const q = (recent[i][2] - t0) / span, cur = toS(recent[i][0], recent[i][1]);
      ax.strokeStyle = `rgba(255,255,255,${.75 * q * q})`; ax.lineWidth = (.8 + 1.6 * q) * dpr * Math.min(zs, 1.8);
      ax.beginPath(); ax.moveTo(prev[0], prev[1]); ax.lineTo(cur[0], cur[1]); ax.stroke();
      prev = cur;
    }
  }

  const [ex, ey] = toS(cx + a * Math.cos(tau), cy - a * Math.sin(tau)), [px, py] = toS(...pos(tau));
  ax.save();
  ax.shadowColor = 'rgba(200,185,255,.95)'; ax.shadowBlur = 10 * dpr;
  ax.strokeStyle = 'rgba(255,255,255,.88)'; ax.lineWidth = 1.5 * dpr; ax.lineCap = 'round';
  ax.beginPath(); ax.moveTo(ccx, ccy); ax.lineTo(ex, ey); ax.lineTo(px, py); ax.stroke();
  ax.fillStyle = '#fff'; ax.beginPath(); ax.arc(ex, ey, 2.6 * dpr, 0, TAU); ax.fill();
  ax.restore();
  const tr = 14 * dpr * Math.min(zs, 2);
  g = ax.createRadialGradient(px, py, 0, px, py, tr);
  g.addColorStop(0, '#fff'); g.addColorStop(.25, 'rgba(220,205,255,.7)'); g.addColorStop(1, 'rgba(150,120,255,0)');
  ax.fillStyle = g; ax.beginPath(); ax.arc(px, py, tr, 0, TAU); ax.fill();
  ax.globalCompositeOperation = 'source-over';
}

/* ---------------- the "yes": π becomes 3,14, then slow motion and zoom into the moment ----------------
   3,14 = 157/50 and I started half a turn out of phase, so with 3,14 attempt 25 lands exactly on the golden dot. */
const MEET = 25;
let fin = null;
function renderFinaleTrail() {
  tx.clearRect(0, 0, trail.width, trail.height); styleTrail();
  if (cam.s < 2.5) { strokeRange(0, tau, .02 / K); return; }
  // zoomed in: only the parts of each turn that can be on screen near the dot
  const h = Math.hypot(trail.width, trail.height) / 2 / cam.s + Math.hypot(cam.x - cx - 2 * a, cam.y - cy);
  const w = Math.min(PI, 1.3 * Math.sqrt(2 * h / a) + .1), step = .024 / K / Math.sqrt(cam.s);
  for (let j = 0; j <= MEET; j++) {
    const lo = Math.max(0, j * TAU - w), hi = Math.min(tau, j * TAU + w);
    if (lo < hi) strokeRange(lo, hi, step);
  }
}
function finaleFrame(now) {
  const e = (now - fin.start) / 1000, tEnd = MEET * TAU, tA = tEnd - .85 * TAU, mx = cx + 2 * a;
  phi0 = PI; nBase = 0; turns = 0;
  let redraw = true;
  if (e < 3.5) {                       // π slowly turns into 3,14
    const u = e / 3.5; K = PI + (3.14 - PI) * ease(u); tau = tA; camReset();
    $('#counter').textContent = 'k = ' + K.toLocaleString(lang === 'el' ? 'el-GR' : 'en-US', { minimumFractionDigits: 6, maximumFractionDigits: 6 });
  } else if (e < 11.5) {               // the last approach: slow motion, the camera dives into the dot
    K = 3.14;
    const u = (e - 3.5) / 8;
    tau = tEnd - .85 * TAU * Math.pow(1 - u, 2.6);
    cam.s = 1 + 9 * ease(clamp(u * 1.08, 0, 1));
    const cu = ease(clamp(u * 2, 0, 1)); cam.x = cx + (mx - cx) * cu; cam.y = cy;
    if (!fin.c1) { fin.c1 = 1; $('#counter').innerHTML = L.yesTitle; caption(L.fin1); }
    if (u > .45 && !fin.c2) { fin.c2 = 1; caption(L.fin2); }
    if (now > fin.beat) { Snd.thump(); fin.beat = now + 950 - 500 * u; }
  } else if (e < 15) {                 // the moment. hold it.
    tau = tEnd; cam.s = 10; cam.x = mx; cam.y = cy;
    if (!fin.touched) {
      fin.touched = 1; flashAt = now; Snd.arp();
      try { navigator.vibrate && navigator.vibrate([90, 70, 220]); } catch (er) {}
      document.body.classList.add('closed');
      caption(`<span class="big">${L.yesBig}</span>`);
    } else redraw = false;
  } else if (e < 18.5) {               // and slowly pull back to see the whole path
    const u = ease((e - 15) / 3.5); cam.s = 10 - 9 * u; cam.x = mx + (cx - mx) * u; cam.y = cy;
  } else { finishYes(); return; }
  recent = [];
  for (let i = 0; i <= 40; i++) { const t = tau - .5 * (1 - i / 40), p = pos(t); recent.push([p[0], p[1], t]); }
  if (redraw) renderFinaleTrail();
}
function drawClosed() {
  K = 3.14; phi0 = PI; nBase = 0; turns = 0; tau = MEET * TAU;
  tx.clearRect(0, 0, trail.width, trail.height); styleTrail();
  strokeRange(0, tau, .012 / K);
  recent = [];
}

/* ---------------- sound ---------------- */
const Snd = {
  ctx: null, on: true, master: null, o2: null,
  start() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const c = this.ctx = new C(), now = c.currentTime;
      const m = this.master = c.createGain(); m.gain.value = 0; m.gain.linearRampToValueAtTime(this.on ? .9 : 0, now + 4);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
      m.connect(lp); lp.connect(c.destination);
      const mk = (f, gv) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.value = gv; o.connect(g); g.connect(m); o.start(); return o; };
      mk(110, .045); this.o2 = mk(110 * PI, .02); mk(55, .03);
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .07; lg.gain.value = .25; lfo.connect(lg); lg.connect(m.gain); lfo.start();
    } catch (e) { this.ctx = null; }
  },
  bell(f, when = 0, v = .12) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 2.001;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + 3.2);
    const g2 = c.createGain(); g2.gain.value = .25; o2.connect(g2); g2.connect(g);
    o.connect(g); g.connect(this.master); o.start(t); o2.start(t); o.stop(t + 3.3); o2.stop(t + 3.3);
  },
  chime(i) { const s = [523.25, 587.33, 659.25, 783.99, 880, 1046.5]; this.bell(s[clamp(i, 0, 5)]); this.bell(s[clamp(i, 0, 5)] * 1.5, .22, .06); },
  glide() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime; this.o2.frequency.cancelScheduledValues(t);
    this.o2.frequency.setValueAtTime(this.o2.frequency.value, t); this.o2.frequency.linearRampToValueAtTime(330, t + 3.5);
  },
  thump() {
    const c = this.ctx; if (!c) return;
    [[0, .32], [.2, .2]].forEach(([dt, v]) => {
      const t = c.currentTime + dt, o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(62, t); o.frequency.exponentialRampToValueAtTime(38, t + .25);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + .32);
    });
  },
  arp() { [261.63, 329.63, 392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.bell(f, i * .14, .11)); },
  toggle() { this.on = !this.on; if (this.master) this.master.gain.setTargetAtTime(this.on ? .9 : 0, this.ctx.currentTime, .2); return this.on; }
};

/* ---------------- story / UI ---------------- */
const story = $('#story');
function caption(html) { story.innerHTML = `<div class="cap">${html}</div>`; }

function updateHeader() {
  if (fin) return;
  if (phase === 'closed') { $('#counter').innerHTML = L.yesTitle; return; }
  if (rollTo) return;
  const held = performance.now() < holdUntil;
  $('#counter').textContent = L.attempt(held ? completed() : completed() + 1);
  $('#statline').textContent = best && best.n >= 2 && phase !== 'ask' ? L.stat(best.n, fmtPct(best.gap)) : '';
}

function showProbe() {
  story.innerHTML = `<div id="probe">
    <div class="q">${L.probeQ}</div>
    <div class="row"><input id="eps" type="range" min="0" max="100" step="1" value="44" aria-label="${L.probeQ}"><output id="epsOut"></output></div>
    <div id="probeAns"></div>
    <div class="btns"><button class="btn gold sm" id="showBtn">${L.show}</button>${data ? `<button class="btn sm" id="nextBtn">${L.next}</button>` : ''}</div>
  </div>`;
  const eps = $('#eps'), out = $('#epsOut'), ans = $('#probeAns');
  let target = null;
  const upd = () => {
    const pct = Math.pow(10, -eps.value * .18); // 1% … 10⁻¹⁸ %
    out.textContent = fmtPct(pct / 100);
    target = RECS.find(r => r.gap * 100 < pct && r.n > 1);
    ans.innerHTML = target ? L.probeAns(target.n) : L.probeBeyond(RECS[RECS.length - 1].n);
    if (!target) target = RECS[RECS.length - 1];
  };
  eps.oninput = upd; upd();
  $('#showBtn').onclick = () => warp(target);
  if (data) $('#nextBtn').onclick = ask;
}

function warp(rec) {
  const now = performance.now();
  holdUntil = now + 1e9;
  document.body.classList.add('fading');
  const from = Math.max(1, completed()), to = rec.n, t0 = now, dur = 1500;
  rollTo = true;
  const roll = () => {
    const u = clamp((performance.now() - t0) / dur, 0, 1);
    const v = Math.round(Math.exp(Math.log(from) + (Math.log(to) - Math.log(from)) * ease(u)));
    $('#counter').textContent = L.attempt(v);
    if (u < 1) requestAnimationFrame(roll);
    else {
      rollTo = null;
      nBase = rec.n; dBase = rec.d; phi0 = TAU * rec.d; tau = 0; turns = 0;
      redrawTrail();
      document.body.classList.remove('fading');
      if (!best || rec.gap <= best.gap) best = { n: rec.n, d: rec.d, gap: rec.gap };
      holdUntil = 0;
      showLens(rec.n, rec.d, rec.gap);
      speedFn = () => .45;
      updateHeader();
    }
  };
  setTimeout(() => requestAnimationFrame(roll), 400);
}

function ask() {
  phase = 'ask';
  speedFn = () => .35;
  story.innerHTML = '';
  $('#askFrom').textContent = data.from ? L.asks(data.from) : '';
  $('#askQ').textContent = data.q || L.defaultQ;
  $('#askTries').textContent = L.tries(data.n);
  $('#askHint').textContent = L.hint;
  $('#yesBtn').textContent = L.yes; $('#noBtn').textContent = L.no;
  $('#ask').hidden = false;
  story.style.visibility = 'hidden';
  document.body.classList.add('asking');
  lensWrap.classList.remove('on'); lensSt = null; $('#statline').textContent = '';
}

function sayYes() {
  document.body.classList.remove('asking'); $('#statline').textContent = '';
  $('#ask').hidden = true; story.style.visibility = '';
  phase = 'finale'; lensWrap.classList.remove('on'); lensSt = null;
  story.innerHTML = '';
  fin = { start: performance.now(), beat: 0 };
  Snd.glide();
}
function finishYes() {
  fin = null; phase = 'closed'; camReset(); drawClosed();
  updateHeader();
  $('#statline').textContent = '';
  const n = (data ? data.n : 0) + 1;
  caption(`<span class="big">${L.yesBig}</span>${L.yesSub(n)}${data ? `<div class="btns"><button class="btn gold sm" id="replyBtn">${L.reply}</button></div>` : ''}`);
  if (data) $('#replyBtn').onclick = () => reply(L.replyYes);
}
function sayNo() {
  document.body.classList.remove('asking');
  $('#ask').hidden = true; story.style.visibility = '';
  phase = 'no'; speedFn = () => .3;
  caption(`<span class="big" style="color:var(--lavender)">${L.noBig}</span>${L.noSub}
    <div class="btns"><button class="btn sm" id="replyBtn">${L.reply}</button><button class="btn ghost sm" id="changedBtn" style="visibility:hidden">${L.changed}</button></div>`);
  $('#replyBtn').onclick = () => reply(L.replyNo);
  setTimeout(() => { const b = $('#changedBtn'); if (b) { b.style.visibility = ''; b.onclick = ask; } }, 9000);
}

async function reply(text) {
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  copy(text);
}
function copy(text) {
  const done = () => toast(L.copied);
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
}
let toastT; function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------------- builder ---------------- */
function openBuilder() {
  $('#builder').hidden = false; $('#intro').hidden = true; $('#ask').hidden = true;
  if (phase !== 'story') { phase = 'idle'; speedFn = () => .6; }
}
/* Where the page lives on the web. Used when it is opened from a file, an app preview or about:blank,
   so the link you send always points to a real page. Change it if you host the page on your own site. */
const PUBLIC_URL = 'https://raw.githack.com/kapoios123/triadak/ccr-e80192b0-48yac7/pi-meet/chance.html';
const pageBase = () => /^https?:$/.test(location.protocol) ? location.href.split('#')[0] : PUBLIC_URL;
function buildLink() {
  const o = { to: $('#bTo').value.trim(), from: $('#bFrom').value.trim(), q: $('#bQ').value.trim(), n: parseInt($('#bN').value) || 0, l: lang };
  return pageBase() + '#d=' + encode(o);
}
function go(url) {
  if (url.split('#')[0] === location.href.split('#')[0]) { location.href = url; return; }
  const w = window.open(url, '_blank', 'noopener'); if (!w) location.href = url;
}

function applyLang() {
  L = T[lang];
  document.documentElement.lang = lang;
  document.title = L.title;
  $('#langBtn').textContent = lang === 'el' ? 'EN' : 'ΕΛ';
  $('#makeBtn').textContent = L.make;
  stage.setAttribute('aria-label', L.aria);
  $('#introFor').textContent = L.for; $('#introTap').textContent = L.tap; $('#introSnd').textContent = '♪ ' + L.snd;
  $('#bTitle').innerHTML = L.bTitle; $('#bLead').textContent = L.bLead;
  $('#bToL').textContent = L.bTo; $('#bFromL').textContent = L.bFrom; $('#bQL').textContent = L.bQ; $('#bNL').textContent = L.bN;
  $('#bQ').placeholder = L.defaultQ;
  $('#bMake').textContent = L.bMake; $('#bDemo').textContent = L.bDemo; $('#bReady').textContent = L.bReady;
  $('#bCopy').textContent = L.copy; $('#bShare').textContent = L.share; $('#bPreview').textContent = L.preview;
  $('#bPrivacy').textContent = L.privacy;
  if (data && data.to) $('#forline').innerHTML = `${L.for} <b>${esc(data.to)}</b>`;
  else $('#forline').textContent = phase === 'idle' ? L.title : '';
  updateHeader();
}

/* ---------------- start ---------------- */
function begin() {
  const intro = $('#intro');
  intro.classList.add('gone'); setTimeout(() => intro.hidden = true, 1000);
  Snd.start();
  reset();
  phase = 'story';
  speedFn = () => .3 + Math.min(turns, 10) * .07;
  caption(L.script[0]);
}
function reset() {
  K = PI; tau = 0; nBase = 0; dBase = 0; phi0 = PI; turns = 0; best = null; holdUntil = 0; recent = [];
  lastRec = -99; driftN = 0; lensDone = false; fin = null; camReset();
  lensSt = null; lensWrap.classList.remove('on'); flashAt = 0;
  document.body.classList.remove('closed', 'fading');
  tx.clearRect(0, 0, trail.width, trail.height); styleTrail();
  updateHeader();
}

$('#muteBtn').onclick = () => { Snd.start(); $('#muteBtn').style.opacity = Snd.toggle() ? 1 : .45; };
$('#langBtn').onclick = () => { lang = lang === 'el' ? 'en' : 'el'; if (data) data.l = lang; applyLang();
  if (phase === 'ask') ask(); };
$('#makeBtn').onclick = openBuilder;
$('#yesBtn').onclick = sayYes;
$('#noBtn').onclick = sayNo;
$('#bMake').onclick = () => { const u = buildLink(); $('#bLink').textContent = u; $('#linkOut').hidden = false; };
$('#bCopy').onclick = () => copy($('#bLink').textContent);
$('#bShare').onclick = () => { const u = $('#bLink').textContent; navigator.share ? navigator.share({ url: u }).catch(() => {}) : copy(u); };
$('#bPreview').onclick = () => go($('#bLink').textContent);
$('#bDemo').onclick = () => go(pageBase() + '#d=' + encode({ to: '', from: '', q: '', n: 3, l: lang }));
addEventListener('hashchange', () => location.reload());
addEventListener('resize', () => { clearTimeout(layout.tm); layout.tm = setTimeout(layout, 80); });
let paused = false;
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (fin) { finaleFrame(now);
  } else if (!paused && phase !== 'closed' && phase !== 'pre' && now >= holdUntil && !rollTo) {
    advance(dt);
    if (now - (frame.h || 0) > 250) { frame.h = now; updateHeader(); }
  }
  drawArms(now);
  drawLens(now);
  bx.clearRect(0, 0, bloom.width, bloom.height);
  bx.drawImage(trail, 0, 0, bloom.width, bloom.height);
  requestAnimationFrame(frame);
}

if (data) {
  phase = 'pre';
  $('#introName').textContent = data.to || '';
  if (!data.to) $('#introFor').textContent = '';
  $('#intro').hidden = false;
  $('#intro').addEventListener('click', begin, { once: true });
} else {
  phase = 'idle';
  $('#builder').hidden = false;
}
applyLang();
if (!data || !data.to) $('#introFor').textContent = '';
layout();
requestAnimationFrame(frame);
})();
</script>
